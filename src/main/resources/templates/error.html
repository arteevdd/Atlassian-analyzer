<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка - Atlassian Analyzer</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/favicon/site.webmanifest">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: #0052CC;
        }
        .error-container {
            text-align: center;
            padding: 50px 0;
        }
    </style>
</head>
<body>
<!-- Синяя навигационная панель -->
<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Atlassian Analyzer</span>
    </div>
</nav>

<!-- Контент ошибки -->
<div class="container">
    <div class="error-container">
        <h1 th:text="${statusCode}">404</h1>
        <h2 th:text="${errorMessage}">Страница не найдена</h2>
        <p class="text-muted mb-4">Извините, запрошенная страница не существует.</p>
        <a href="/" class="btn btn-primary">Вернуться на главную</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Atlassian Analyzer - ' + ${projectName}">Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: #0052CC;
        }
    </style>
</head>
<body>
<!-- Синяя навигационная панель -->
<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Atlassian Analyzer</span>
    </div>
</nav>

<!-- Основной контент -->
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Главная</a></li>
                    <li class="breadcrumb-item active" th:text="${projectName}">Project</li>
                </ol>
            </nav>

            <h2 th:text="${projectName + ' (' + projectKey + ')'}">Project Name (KEY)</h2>
            <p class="text-muted">Аналитика задач проекта</p>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="alert alert-info" role="alert">
                <h4 class="alert-heading">Аналитика в разработке</h4>
                <p>Функциональность аналитических отчетов находится в разработке.</p>
                <hr>
                <p class="mb-0">Скоро здесь появятся графики и диаграммы с аналитикой проекта.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

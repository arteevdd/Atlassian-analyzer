<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlassian Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: #0052CC;
        }
        .project-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<!-- Синяя навигационная панель -->
<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Atlassian Analyzer</span>
    </div>
</nav>

<!-- Основной контент -->
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h2>Доступные проекты</h2>
            <p class="text-muted">Выберите проект для просмотра аналитики</p>
        </div>
    </div>

    <div class="row mt-4">
        <div th:each="project : ${projects}" class="col-md-6 col-lg-4 mb-4">
            <div class="card project-card h-100"
                 th:data-project-key="${project.key}"
                 onclick="navigateToProject(this)">
                <div class="card-body">
                    <h5 class="card-title" th:text="${project.name}">Project Name</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${project.key}">PROJECT_KEY</h6>
                    <p class="card-text" th:text="${project.description} ?: 'Описание недоступно'">Project description</p>
                </div>
                <div class="card-footer bg-transparent">
                    <small class="text-primary">Посмотреть статистику →</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Сообщение если проектов нет -->
    <div th:if="${#lists.isEmpty(projects)}" class="row">
        <div class="col-12">
            <div class="alert alert-info" role="alert">
                Нет доступных проектов для отображения.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function navigateToProject(element) {
        const projectKey = element.getAttribute('data-project-key');
        window.location.href = '/project/' + projectKey;
    }
</script>
</body>
</html>

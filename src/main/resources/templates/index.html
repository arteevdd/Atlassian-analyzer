<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlassian Analyzer</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background-color: #0052CC; }
        .project-card {
            transition: transform 0.2s;
            cursor: pointer;
            height: 100%;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .project-description {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
            max-height: 4.2em;
        }
        /* Retired проекты - красные */
        .retired-project {
            border-left: 4px solid #dc3545;
            background-color: #fff5f5;
        }
        .retired-project .card-title {
            color: #dc3545;
        }
        .retired-project .card-subtitle {
            color: #e74c3c !important;
        }
        .retired-project .no-description {
            color: #dc3545;
        }
        .retired-project .card-footer {
            background-color: #ffe6e6;
        }
        /* Active проекты - зеленые */
        .active-project {
            border-left: 4px solid #28a745;
        }
        .active-project .card-title {
            color: #28a745;
        }
        .project-status {
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .status-retired {
            background-color: #dc3545;
            color: white;
        }
        .status-active {
            background-color: #28a745;
            color: white;
        }
        .no-description {
            font-style: italic;
            color: #6c757d;
        }
        .card-body {
            display: flex;
            flex-direction: column;
        }
        .card-text {
            flex-grow: 1;
            display: flex;
            align-items: center;
            min-height: 60px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Atlassian Analyzer</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h2>Доступные проекты</h2>
            <p class="text-muted">Выберите проект для просмотра аналитики</p>
        </div>
    </div>

    <div class="row mt-4">
        <div th:each="project : ${projects}" class="col-md-6 col-lg-4 mb-4">
            <div class="card project-card h-100"
                 th:data-project-key="${project.key}"
                 th:classappend="${#strings.contains(project.name, '(Retired)')} ? 'retired-project' : 'active-project'"
                 onclick="navigateToProject(this)">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0" th:text="${project.name}">Project Name</h5>
                        <span th:if="${#strings.contains(project.name, '(Retired)')}"
                              class="project-status status-retired">RETIRED</span>
                        <span th:unless="${#strings.contains(project.name, '(Retired)')}"
                              class="project-status status-active">ACTIVE</span>
                    </div>
                    <h6 class="card-subtitle mb-3 text-muted" th:text="${project.key}">PROJECT_KEY</h6>

                    <!-- Описание для активных проектов -->
                    <p th:if="${not #strings.contains(project.name, '(Retired)') and project.description != null}"
                       class="card-text project-description mt-2"
                       th:text="${project.description}">
                        Project description
                    </p>

                    <!-- Заглушка для retired проектов -->
                    <p th:if="${#strings.contains(project.name, '(Retired)')}"
                       class="card-text no-description mt-2">
                        Проект закрыт и перемещен в архив
                    </p>

                    <!-- Заглушка если нет описания у активного проекта -->
                    <p th:if="${not #strings.contains(project.name, '(Retired)') and project.description == null}"
                       class="card-text no-description mt-2">
                        Описание недоступно
                    </p>
                </div>
                <div class="card-footer bg-transparent">
                    <small class="text-primary">Посмотреть статистику →</small>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(projects)}" class="row">
        <div class="col-12">
            <div class="alert alert-info" role="alert">
                Нет доступных проектов для отображения.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function navigateToProject(element) {
        const projectKey = element.getAttribute('data-project-key');
        window.location.href = '/project/' + projectKey;
    }
</script>
</body>
</html>
